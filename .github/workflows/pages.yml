name: Publicar Hells Gate Books

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do site
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Integrar editor direto e livros PDF
        shell: bash
        run: |
          cat .site-upgrade/part*.txt | base64 -d | tar -xJ -C .
          node --check library-upgrade-v2.js
          node --check library-pdf-large.js
          node --check resource-library.js
          node --check library-gardens-bulk.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          text=p.read_text(encoding="utf-8")
          if "library-upgrade-v2.js" not in text:
              text=text.replace("</head>",'<link rel="stylesheet" href="library-upgrade-v2.css" /></head>')
              text=text.replace("</body>",'<script src="library-upgrade-v2.js" defer></script></body>')
          if "library-pdf-large.js" not in text:
              text=text.replace("</body>",'<script src="library-pdf-large.js" defer></script></body>')
          if "resource-library.js" not in text:
              text=text.replace("</head>",'<link rel="stylesheet" href="resource-library.css" /></head>')
              text=text.replace("</body>",'<script src="resource-library.js" defer></script></body>')
          if "library-gardens-bulk.js" not in text:
              text=text.replace("</body>",'<script src="library-gardens-bulk.js" defer></script></body>')
          p.write_text(text,encoding="utf-8")
          PY
      - name: Vincular acervo ao Supabase com login protegido
        run: python3 cloud-build.py
      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
